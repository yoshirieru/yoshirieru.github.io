<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#131019">
<title>音声プレイヤー</title>
<style>
  /* ==========================================================
     デザイントークン（色・余白・角丸などをまとめて管理）
     配色を変えたい場合はこの :root 内の値だけ書き換えればOK
  ========================================================== */
  :root{
    --bg:#131019;
    --surface:#1d1926;
    --surface-2:#272231;
    --surface-hover:#302a3d;
    --border:rgba(255,255,255,0.08);
    --text:#f4f1ea;
    --text-dim:#a29dae;
    --text-faint:#6b6578;
    --accent:#e8a33d;          /* メインアクセント（琥珀色 / ヴィンテージオーディオ機器のダイヤルをイメージ） */
    --accent-soft:rgba(232,163,61,0.16);
    --accent-ink:#1a1420;      /* アクセント背景の上に乗る文字色 */

    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(0,0,0,0.35);

    --font-display:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --font-mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;

    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button{ font-family:inherit; }
  ul{ list-style:none; }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ---------- 上部固定エリア（タイトル + プレイヤー） ---------- */
  .top-sticky{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
    padding-top:var(--safe-top);
    box-shadow:0 12px 24px -12px rgba(0,0,0,0.5);
  }

  .app-header{
    padding:18px 20px 6px;
  }
  .eyebrow{
    margin:0;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:.68rem;
    font-weight:700;
    color:var(--text-faint);
  }
  .app-header h1{
    margin:4px 0 0;
    font-size:1.15rem;
    font-weight:800;
    letter-spacing:-.01em;
  }

  .player-card{
    margin:10px 16px 16px;
    padding:22px 20px 18px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
  }

  /* ---------- レコード盤風のディスク表示 ---------- */
  .disc-wrap{
    position:relative;
    width:clamp(96px,30vw,132px);
    aspect-ratio:1/1;
    margin:0 auto 16px;
  }
  .disc-glow{
    position:absolute;
    inset:-18px;
    background:radial-gradient(circle,var(--accent) 0%,transparent 70%);
    opacity:.28;
    filter:blur(14px);
    pointer-events:none;
  }
  .disc{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background:linear-gradient(145deg,#2c2838,#17141f);
    box-shadow:0 6px 18px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow:hidden;
    animation:spin 7s linear infinite;
    animation-play-state:paused;
  }
  .disc.spinning{ animation-play-state:running; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .disc-grooves{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:repeating-radial-gradient(circle at center,
      rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1.5px,
      transparent 1.5px, transparent 6px);
  }
  .disc-cover{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }
  .disc.has-cover .disc-grooves{ display:none; }
  .disc-center{
    position:absolute;
    width:24%;
    height:24%;
    top:38%;
    left:38%;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px #1d1926, 0 0 12px rgba(232,163,61,.55);
  }

  /* ---------- 曲情報 ---------- */
  .track-meta{ text-align:center; padding:0 6px; }
  .track-title{
    margin:0;
    font-size:clamp(1.02rem,4.2vw,1.2rem);
    font-weight:800;
    letter-spacing:-.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-subtitle{
    margin:4px 0 0;
    font-size:.82rem;
    color:var(--text-dim);
    line-height:1.4;
  }
  .track-subtitle.is-error{ color:#e8845f; }

  /* ---------- シークバー行 ---------- */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
  }
  .time{
    font-family:var(--font-mono);
    font-size:.72rem;
    color:var(--text-dim);
    min-width:32px;
    text-align:center;
    flex-shrink:0;
  }
  input[type="range"]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:2px;
    background:var(--surface-2);
    outline:none;
    cursor:pointer;
    touch-action:manipulation;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft);
    border:none;
    transition:transform .15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:active{ transform:scale(1.25); }
  input[type="range"]::-moz-range-track{
    height:4px; border-radius:2px; background:var(--surface-2);
  }
  input[type="range"]::-moz-range-progress{
    height:4px; border-radius:2px; background:var(--accent);
  }
  input[type="range"]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;
    box-shadow:0 0 0 4px var(--accent-soft);
  }

  /* ---------- 再生コントロール ---------- */
  .controls-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:18px;
  }
  .ctrl-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:transparent;
    border:none;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .ctrl-btn:active{ color:var(--text); background:var(--surface-2); }
  .ctrl-btn .icon{ width:20px; height:20px; fill:currentColor; }

  .play-btn{
    width:62px;
    height:62px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    color:var(--accent-ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(232,163,61,.35);
    transition:transform .12s ease;
  }
  .play-btn:active{ transform:scale(.93); }
  .play-btn .icon{ width:26px; height:26px; fill:currentColor; }
  .play-btn .icon-pause{ display:none; }
  .play-btn.is-playing .icon-play{ display:none; }
  .play-btn.is-playing .icon-pause{ display:block; }

  /* ---------- プレイリスト ---------- */
  .playlist-section{
    flex:1;
    padding:6px 16px calc(28px + var(--safe-bottom));
  }
  .playlist-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:10px 4px 12px;
  }
  .track-count{
    font-family:var(--font-mono);
    font-size:.75rem;
    color:var(--text-dim);
  }
  .playlist{
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .track-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    color:var(--text);
    text-align:left;
    cursor:pointer;
    min-height:56px;
  }
  .track-item:active{ background:var(--surface-hover); }
  .track-item.active{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .track-num{
    width:26px;
    flex-shrink:0;
    text-align:center;
    font-family:var(--font-mono);
    font-size:.8rem;
    color:var(--text-faint);
  }
  .track-item.active .track-num{ color:var(--accent); }

  .eq{
    width:26px;
    flex-shrink:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:2.5px;
    height:14px;
  }
  .eq span{
    width:3px;
    height:5px;
    border-radius:1px;
    background:var(--accent);
  }
  .track-item.active .eq span{ animation:eqbounce .9s ease-in-out infinite; }
  .track-item.active .eq span:nth-child(2){ animation-delay:.15s; }
  .track-item.active .eq span:nth-child(3){ animation-delay:.3s; }
  .track-item.active.paused .eq span{ animation:none; height:5px; }
  @keyframes eqbounce{ 0%,100%{ height:4px; } 50%{ height:14px; } }

  .track-info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .track-info .t-title{
    font-size:.92rem;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-info .t-subtitle{
    font-size:.76rem;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-duration{
    font-family:var(--font-mono);
    font-size:.75rem;
    color:var(--text-dim);
    flex-shrink:0;
  }

  .empty-state{
    text-align:center;
    color:var(--text-dim);
    font-size:.85rem;
    padding:30px 10px;
  }

  /* キーボード操作時のフォーカス表示 */
  button:focus-visible,
  input[type="range"]:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion:reduce){
    .disc{ animation:none !important; }
    .eq span{ animation:none !important; }
  }
</style>
</head>
<body>
<noscript>このページの再生機能にはJavaScriptが必要です。ブラウザの設定でJavaScriptを有効にしてください。</noscript>

<div class="app">

  <div class="top-sticky">
    <header class="app-header">
      <p class="eyebrow">AUDIO</p>
      <h1 id="appTitle"></h1>
    </header>

    <section class="player-card" aria-label="音声プレイヤー">
      <div class="disc-wrap">
        <div class="disc-glow" aria-hidden="true"></div>
        <div class="disc" id="disc">
          <img id="discCover" class="disc-cover" alt="" hidden>
          <div class="disc-grooves" aria-hidden="true"></div>
          <div class="disc-center" aria-hidden="true"></div>
        </div>
      </div>

      <div class="track-meta">
        <p class="track-title" id="trackTitle">曲を選択してください</p>
        <p class="track-subtitle" id="trackSubtitle">下のリストから曲をタップすると再生が始まります</p>
      </div>

      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
        <span class="time" id="durationTime">0:00</span>
      </div>

      <div class="controls-row">
        <button type="button" class="ctrl-btn" id="prevBtn" aria-label="前のトラック">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
        </button>
        <button type="button" class="play-btn" id="playBtn" aria-label="再生">
          <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="nextBtn" aria-label="次のトラック">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
        </button>
      </div>
    </section>
  </div>

  <section class="playlist-section" aria-label="トラック一覧">
    <div class="playlist-header">
      <p class="eyebrow">PLAYLIST</p>
      <span class="track-count" id="trackCount"></span>
    </div>
    <ul class="playlist" id="playlist"></ul>
  </section>

</div>

<audio id="audio" preload="none"></audio>

<script>
/* ============================================================
   ここから下の「設定」ブロックだけ編集すれば
   タイトルや曲の追加・変更ができます。
   ============================================================ */

// ページ上部に表示されるタイトル
const APP_TITLE = "YOSHIRIERU";

// 再生する音声トラックの一覧
// title    : 曲名（必須）
// src      : 音声ファイルのパス（必須／index.html と同じ場所に置く想定）
// subtitle : 曲の説明やページ番号など（任意／不要なら空文字 "" でOK）
// duration : 再生時間の表示（任意／"3:45" のように指定。省略すると初回再生時に自動で表示されます）
// cover    : ジャケット画像のパス（任意／指定しない場合はレコード盤風のデザインが表示されます）
const TRACKS = [
  { title: "ラストリモート(和風ロック)", subtitle: "",     src: "audio/ラストリモート(和風ロック).mp3", duration: "", cover: "" },
  { title: "おてんば恋娘(8bit)", subtitle: "",     src: "audio/おてんば恋娘(8bit).mp3", duration: "", cover: "" },
  { title: "プレイヤーズスコア(和風)", subtitle: "",     src: "audio/プレイヤーズスコア(和風).mp3", duration: "", cover: "" },
];

/* ============================================================
   ここから下は表示・再生の仕組み（通常は編集不要）
   ============================================================ */

const audio = document.getElementById('audio');
const disc = document.getElementById('disc');
const discCover = document.getElementById('discCover');
const trackTitleEl = document.getElementById('trackTitle');
const trackSubtitleEl = document.getElementById('trackSubtitle');
const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');
const seek = document.getElementById('seek');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playlistEl = document.getElementById('playlist');
const trackCountEl = document.getElementById('trackCount');
const appTitleEl = document.getElementById('appTitle');

let currentIndex = null;
let isPlaying = false;
let isSeeking = false;

appTitleEl.textContent = APP_TITLE;
document.title = APP_TITLE;
trackCountEl.textContent = TRACKS.length + '曲';

function esc(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

function formatTime(sec){
  if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function renderPlaylist(){
  if (TRACKS.length === 0){
    playlistEl.innerHTML = '<li class="empty-state">トラックが登録されていません</li>';
    return;
  }
  playlistEl.innerHTML = TRACKS.map((t, i) => {
    const active = i === currentIndex;
    const paused = active && !isPlaying;
    const indexCell = active
      ? '<span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>'
      : '<span class="track-num">' + String(i + 1).padStart(2, '0') + '</span>';
    return (
      '<li>' +
        '<button type="button" class="track-item' + (active ? ' active' : '') + (paused ? ' paused' : '') + '" data-index="' + i + '">' +
          indexCell +
          '<span class="track-info">' +
            '<span class="t-title">' + esc(t.title || '無題のトラック') + '</span>' +
            (t.subtitle ? '<span class="t-subtitle">' + esc(t.subtitle) + '</span>' : '') +
          '</span>' +
          '<span class="track-duration">' + esc(t.duration || '') + '</span>' +
        '</button>' +
      '</li>'
    );
  }).join('');
}

function updatePlayButton(){
  playBtn.classList.toggle('is-playing', isPlaying);
  playBtn.setAttribute('aria-label', isPlaying ? '一時停止' : '再生');
}

function loadTrack(index, autoplay){
  if (index < 0 || index >= TRACKS.length) return;
  currentIndex = index;
  const track = TRACKS[index];

  audio.src = track.src;
  trackTitleEl.textContent = track.title || '無題のトラック';
  trackSubtitleEl.textContent = track.subtitle || '';
  trackSubtitleEl.classList.remove('is-error');
  durationTimeEl.textContent = track.duration || '0:00';
  currentTimeEl.textContent = '0:00';
  seek.value = 0;
  seek.style.background = '';

  if (track.cover){
    discCover.src = track.cover;
    discCover.hidden = false;
    disc.classList.add('has-cover');
  } else {
    discCover.hidden = true;
    disc.classList.remove('has-cover');
  }

  renderPlaylist();

  if (autoplay){
    const p = audio.play();
    if (p && p.catch) p.catch(() => { /* ユーザー操作なしの自動再生はブラウザに拒否されることがある */ });
  }
}

function playPause(){
  if (currentIndex === null){
    loadTrack(0, true);
    return;
  }
  if (audio.paused) audio.play();
  else audio.pause();
}

function nextTrack(){
  if (currentIndex === null) return;
  if (currentIndex < TRACKS.length - 1){
    loadTrack(currentIndex + 1, true);
  } else {
    audio.pause();
    audio.currentTime = 0;
  }
}

function prevTrack(){
  if (currentIndex === null) return;
  if (audio.currentTime > 3){
    audio.currentTime = 0;
    return;
  }
  if (currentIndex > 0) loadTrack(currentIndex - 1, true);
  else audio.currentTime = 0;
}

/* ---- イベント登録 ---- */

playBtn.addEventListener('click', playPause);
prevBtn.addEventListener('click', prevTrack);
nextBtn.addEventListener('click', nextTrack);

playlistEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.track-item');
  if (!btn) return;
  const idx = Number(btn.dataset.index);
  if (idx === currentIndex){
    playPause();
  } else {
    loadTrack(idx, true);
  }
});

audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayButton();
  disc.classList.add('spinning');
  renderPlaylist();
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayButton();
  disc.classList.remove('spinning');
  renderPlaylist();
});

audio.addEventListener('ended', nextTrack);

audio.addEventListener('loadedmetadata', () => {
  durationTimeEl.textContent = formatTime(audio.duration);
  if (currentIndex !== null && !TRACKS[currentIndex].duration){
    TRACKS[currentIndex].duration = formatTime(audio.duration);
    renderPlaylist();
  }
});

audio.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  currentTimeEl.textContent = formatTime(audio.currentTime);
  if (audio.duration){
    const pct = (audio.currentTime / audio.duration) * 100;
    seek.value = pct;
    seek.style.background = 'linear-gradient(to right, var(--accent) ' + pct + '%, var(--surface-2) ' + pct + '%)';
  }
});

audio.addEventListener('error', () => {
  trackSubtitleEl.textContent = '⚠ 音声ファイルを読み込めませんでした（ファイルパスをご確認ください）';
  trackSubtitleEl.classList.add('is-error');
  isPlaying = false;
  updatePlayButton();
  disc.classList.remove('spinning');
});

seek.addEventListener('pointerdown', () => { isSeeking = true; });
seek.addEventListener('pointerup', () => { isSeeking = false; });

seek.addEventListener('input', () => {
  const pct = Number(seek.value);
  seek.style.background = 'linear-gradient(to right, var(--accent) ' + pct + '%, var(--surface-2) ' + pct + '%)';
  if (audio.duration){
    const time = (pct / 100) * audio.duration;
    currentTimeEl.textContent = formatTime(time);
  }
});

seek.addEventListener('change', () => {
  if (audio.duration){
    audio.currentTime = (Number(seek.value) / 100) * audio.duration;
  }
});

/* ---- 初期描画 ---- */
renderPlaylist();
</script>
</body>
</html>
